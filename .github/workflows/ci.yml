name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -v

  image:
    needs: test
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false   # no build-record artifact: it fills the account's artifact storage
    if: github.event_name == 'push'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          load: true
          tags: chai-shop:scan
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: chai-shop:scan
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chai-shop:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/chai-shop:latest
