name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -v

  image:
    needs: test
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false   # no build-record artifact: it fills the account's artifact storage
    if: github.event_name == 'push'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          load: true
          tags: chai-shop:scan   # no cache here: measured, this native build takes 17 s, fetching the cache took 146 s
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: chai-shop:scan
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chai-shop:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/chai-shop:latest
          cache-from: type=gha,scope=push
          cache-to: type=gha,mode=max,scope=push   # one cache, both platforms (the slow emulated amd64 build too)

  deploy:
    needs: image
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          sed -i "s|newTag: .*|newTag: ${{ github.sha }}|" k8s/app/kustomization.yaml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy ${{ github.sha }}"
          git push
