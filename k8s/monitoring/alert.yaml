apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: chai-shop
  labels:
    release: monitoring
spec:
  groups:
    - name: chai-shop
      rules:
        - alert: ChaiShopDown
          expr: sum(up{job="chai-shop"}) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: No Chai shop pod is answering
