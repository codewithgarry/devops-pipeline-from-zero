apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chai-shop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/codewithgarry/devops-pipeline-from-zero.git
    targetRevision: main
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
